services:
  # Main OSINT scanner — leak finder + balance checker
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-osint-scanner
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./state:/app/state
    command: ["leak-finder", "--continuous", "--interval", "300"]
    networks:
      - osint-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # FastAPI server — REST API for the OSINT platform
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-osint-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./state:/app/state
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - osint-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # Identity resolver — on-demand identity resolution
  resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-osint-resolver
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    command: ["resolve", "--help"]
    networks:
      - osint-net
    profiles:
      - on-demand

  # SQLite database (shared state)
  # For distributed: replace with PostgreSQL
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: osint
  #     POSTGRES_USER: osint
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-osint}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   networks:
  #     - osint-net

# volumes:
#   pg-data:

networks:
  osint-net:
    driver: bridge
