version: "3.8"

services:
  1ai-osint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-osint
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - OMNIROUTE_BASE_URL=http://omniroute:3000/v1
    depends_on:
      omniroute:
        condition: service_started
    networks:
      - osint-net

  omniroute:
    image: omniroute/omniroute:latest
    container_name: omniroute
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - omniroute-data:/data
    networks:
      - osint-net

volumes:
  omniroute-data:

networks:
  osint-net:
    driver: bridge
