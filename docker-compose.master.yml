version: "3.8"

services:
  # Master API — coordinates all scanner nodes
  master-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-osint-master
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://osint:${DB_PASSWORD:-osint}@postgres:5432/osint_shared
    ports:
      - "8420:8420"
    command: ["python", "-m", "uvicorn", "src.modules.node.master_api:app", "--host", "0.0.0.0", "--port", "8420"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osint-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # PostgreSQL — shared state database
  postgres:
    image: postgres:16-alpine
    container_name: 1ai-osint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: osint_shared
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-osint}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - osint-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osint_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  pg-data:

networks:
  osint-net:
    driver: bridge
