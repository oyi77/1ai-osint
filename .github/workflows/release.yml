name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and source dist
        run: python -m build

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

      - name: Build Docker image
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          docker build -t 1ai-osint:$TAG_NAME -t 1ai-osint:latest .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG_NAME=${GITHUB_REF#refs/tags/}
          docker tag 1ai-osint:$TAG_NAME $IMAGE:$TAG_NAME
          docker tag 1ai-osint:latest $IMAGE:latest
          docker push $IMAGE:$TAG_NAME
          docker push $IMAGE:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
