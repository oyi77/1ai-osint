[project]
name = "1ai-osint"
version = "0.1.0"
description = "AI-Powered OSINT & ZKIT Research Platform"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "langgraph>=0.1.0",
    "openai>=1.0.0",
    "bip-utils>=2.10.0",
    "langchain-openai",
    "pydantic-settings",
    "gitpython",
    "sarif-om",
    "reportlab",
    "requests",
    "eth-account>=0.10.0",
    "aiosqlite>=0.19.0",
    "web3>=6.0",
    "solana>=0.34",
    "solders>=0.21",
    "telethon>=1.36",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
crypto = [
    "bip-utils>=2.10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=79 --cov-config=.coveragerc"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
