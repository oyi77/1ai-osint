[project]
name = "1ai-osint"
version = "0.1.0"
description = "AI-Powered OSINT & ZKIT Research Platform"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "1ai-osint contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["osint", "crypto", "security", "zkit", "leak-finder"]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "langgraph>=0.1.0",
    "openai>=1.0.0",
    "bip-utils>=2.10.0",
    "langchain-openai",
    "pydantic-settings",
    "gitpython",
    "sarif-om",
    "reportlab",
    "requests",
    "eth-account>=0.10.0",
    "aiosqlite>=0.19.0",
    "web3>=6.0",
    "solana>=0.34",
    "solders>=0.21",
    "telethon>=1.36",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "sherlock-project>=0.14.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psutil",
    "playwright>=1.60.0",
    "duckduckgo-search>=8.1.1",
    "googlesearch-python>=1.3.0",
]

[project.optional-dependencies]
crypto = [
    "bip-utils>=2.10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "pre-commit>=3.7",
    "httpx>=0.25",
    "bip-utils>=2.10.0",
    "openai>=1.0.0",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/oyi77/1ai-osint"
Repository = "https://github.com/oyi77/1ai-osint"
Issues = "https://github.com/oyi77/1ai-osint/issues"

[project.scripts]
1ai-osint = "src.cli.main:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
